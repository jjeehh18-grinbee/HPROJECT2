<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f28c26">
  <title>로그인 · 마이 팜</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-client.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-intro" aria-label="서비스 소개">
      <a class="auth-brand" href="auth.html">
        <img src="assets/grinbeelogo.png" alt="그린비 로고">
        <span>마이 팜<small>디지털 팜 다이어리 + AI</small></span>
      </a>
      <div>
        <span class="eyebrow">MY FARM</span>
        <h1>농장의 오늘을 기록하고<br>내일을 준비하세요.</h1>
        <p>작업과 환경정보를 한곳에서 관리하는<br>우리 농장 디지털 팜 다이어리입니다.</p>
      </div>
    </section>

    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-card">
        <h2 id="auth-title">마이 팜 시작하기</h2>
        <p>이메일로 로그인하거나 새 계정을 만들어주세요.</p>

        <div class="auth-tabs" role="tablist" aria-label="인증 방식">
          <button type="button" class="selected" data-auth-tab="login" role="tab" aria-selected="true">로그인</button>
          <button type="button" data-auth-tab="signup" role="tab" aria-selected="false">회원가입</button>
        </div>

        <div id="auth-message" class="auth-message" role="status" aria-live="polite"></div>

        <form id="login-form" class="auth-form">
          <label for="login-email">이메일</label>
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="farm@example.com" required>
          <label for="login-password">비밀번호</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
          <button class="button primary" type="submit">로그인</button>
        </form>

        <form id="signup-form" class="auth-form" hidden>
          <label for="signup-email">이메일</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" placeholder="farm@example.com" required>
          <label for="signup-password">비밀번호</label>
          <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="6자 이상 입력하세요" required>
          <p class="auth-hint">비밀번호는 6자 이상 입력해주세요.</p>
          <button class="button primary" type="submit">회원가입</button>
        </form>
      </div>
    </section>
  </main>
  <noscript>이 서비스를 사용하려면 JavaScript를 활성화해주세요.</noscript>
</body>
</html>
